<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmed · TechMart</title>
</head>
<body style="margin:0;padding:0;background-color:#ebede7;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ebede7;padding:40px 20px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:540px;background-color:#ffffff;border-radius:24px;border:1px solid rgba(17,20,24,0.07);overflow:hidden;">

        <tr><td style="padding:32px 40px 8px;">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr>
            <td style="vertical-align:middle;"><img src="https://your-domain.com/images/logo.png" alt="TechMart" width="36" height="36" style="display:block;border-radius:999px;background:#16243f;"></td>
            <td style="vertical-align:middle;padding-left:10px;font-size:18px;font-weight:800;color:#15181d;letter-spacing:-0.5px;">TechMart</td>
          </tr></table>
        </td></tr>

        <tr><td style="padding:20px 40px 8px;" align="center">
          <div style="width:56px;height:56px;margin:0 auto 8px;border-radius:999px;background:#cdf24a;line-height:56px;text-align:center;">
            <span style="font-size:26px;color:#15181d;font-weight:800;">✓</span>
          </div>
        </td></tr>

        <tr><td style="padding:0 40px 8px;" align="center">
          <h1 style="margin:0 0 8px;font-size:24px;font-weight:800;color:#15181d;letter-spacing:-0.5px;">{{action_type}} confirmed</h1>
          <p style="margin:0;font-size:15px;line-height:1.65;color:#6b7280;">Hi {{user_name}}, all done. Here's a quick summary:</p>
        </td></tr>

        <tr><td style="padding:20px 40px 8px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f1;border-radius:14px;">
            <tr><td style="padding:18px 20px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr><td style="padding:7px 0;font-size:13px;color:#6b7280;">What</td><td style="padding:7px 0;font-size:14px;color:#15181d;text-align:right;font-weight:600;">{{action_type}}</td></tr>
                <tr><td colspan="2" style="border-bottom:1px solid rgba(17,20,24,0.06);"></td></tr>
                <tr><td style="padding:7px 0;font-size:13px;color:#6b7280;">When</td><td style="padding:7px 0;font-size:14px;color:#15181d;text-align:right;font-weight:600;">{{date}}</td></tr>
                <tr><td colspan="2" style="border-bottom:1px solid rgba(17,20,24,0.06);"></td></tr>
                <tr><td style="padding:7px 0;font-size:13px;color:#6b7280;">Reference</td><td style="padding:7px 0;font-size:14px;color:#16243f;text-align:right;font-weight:600;">{{reference_id}}</td></tr>
              </table>
            </td></tr>
          </table>
        </td></tr>

        <tr><td style="padding:20px 40px 8px;" align="center">
          <a href="{{action_url}}" style="display:inline-block;padding:14px 34px;background:#16243f;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:999px;">View details</a>
        </td></tr>

        <tr><td style="padding:24px 40px 32px;border-top:1px solid rgba(17,20,24,0.07);text-align:center;margin-top:16px;">
          <p style="margin:0;font-size:12px;color:#9aa1ad;line-height:1.6;">
            If this wasn't you, please contact support right away.<br>
            © 2026 TechMart · Accra, Ghana
          </p>
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
