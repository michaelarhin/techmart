<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your TechMart code</title>
</head>
<body style="margin:0;padding:0;background-color:#ebede7;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ebede7;padding:40px 20px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:540px;background-color:#ffffff;border-radius:24px;border:1px solid rgba(17,20,24,0.07);overflow:hidden;">

        <tr><td style="padding:32px 40px 8px;">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr>
            <td style="vertical-align:middle;"><img src="https://your-domain.com/images/logo.png" alt="TechMart" width="36" height="36" style="display:block;border-radius:999px;background:#16243f;"></td>
            <td style="vertical-align:middle;padding-left:10px;font-size:18px;font-weight:800;color:#15181d;letter-spacing:-0.5px;">TechMart</td>
          </tr></table>
        </td></tr>

        <tr><td style="padding:24px 40px 8px;">
          <h1 style="margin:0 0 12px;font-size:24px;font-weight:800;color:#15181d;letter-spacing:-0.5px;">Your verification code</h1>
          <p style="margin:0 0 20px;font-size:15px;line-height:1.65;color:#6b7280;">
            Hi {{user_name}}, use the code below to continue. It keeps your account safe and sound.
          </p>
        </td></tr>

        <tr><td style="padding:0 40px 8px;" align="center">
          <div style="display:inline-block;padding:18px 36px;background-color:#f4f5f1;border:1px solid rgba(17,20,24,0.07);border-radius:16px;">
            <span style="font-size:34px;font-weight:800;letter-spacing:12px;color:#15181d;font-family:'Courier New',monospace;">{{otp_code}}</span>
          </div>
        </td></tr>

        <tr><td style="padding:18px 40px 8px;" align="center">
          <p style="margin:0;font-size:14px;color:#6b7280;">This code expires in <strong style="color:#15181d;">10 minutes</strong>.</p>
        </td></tr>

        <tr><td style="padding:24px 40px 32px;border-top:1px solid rgba(17,20,24,0.07);text-align:center;margin-top:16px;">
          <p style="margin:0;font-size:12px;color:#9aa1ad;line-height:1.6;">
            Never share this code with anyone — TechMart will never ask for it.<br>
            © 2026 TechMart · Accra, Ghana
          </p>
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
